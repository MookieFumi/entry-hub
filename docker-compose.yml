# Local development only: PostgreSQL for the API and its integration tests.
# The Aspire AppHost replaces this file; delete it when that happens.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: entryhub
      POSTGRES_PASSWORD: entryhub
      POSTGRES_DB: entryhub
    ports:
      - "5432:5432"
    volumes:
      - entryhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entryhub -d entryhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  entryhub-postgres:
