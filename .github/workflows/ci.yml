# .github/workflows/ci.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the report step create and update its single comment on the pull request.
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: entryhub
          POSTGRES_PASSWORD: entryhub
          POSTGRES_DB: entryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entryhub -d entryhub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENTRYHUB_TEST_CONNECTION: Host=localhost;Port=5432;Database=entryhub;Username=entryhub;Password=entryhub

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion needs the full history and the tags
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Governance checks
        # dependency-review needs the Dependency graph turned on in the repository settings
        # (Settings > Security > Advanced Security). Remove the input to enable the check once it is on.
        uses: ./.github/actions/net-governance
        with:
          dependency-review: "false"

      - name: API contract is up to date
        # The Release build in the governance step regenerates contracts/EntryHub.Api.json.
        # A different file means an endpoint changed without committing the new contract.
        run: git diff --exit-code -- contracts

      - name: Kubernetes chart is up to date
        # Regenerates the chart from the AppHost. A different file means the application model changed
        # without committing the new chart (run scripts/publish-k8s.sh).
        run: |
          scripts/publish-k8s.sh
          git diff --exit-code -- deploy

      - name: Version
        run: |
          dotnet tool restore
          dotnet gitversion /output json | tee "$RUNNER_TEMP/gitversion.json"

      - name: Test
        # The tests that start the whole system with Aspire need containers and run in the aspire job.
        run: >
          dotnet test --no-build -c Release
          --filter "Category!=Aspire"
          --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$RUNNER_TEMP/test-results"
        working-directory: src

      - name: Report
        # Runs even when the tests fail, because that is when the report matters most.
        if: ${{ !cancelled() }}
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:$RUNNER_TEMP/test-results/**/coverage.cobertura.xml" \
            "-targetdir:$RUNNER_TEMP/coverage" \
            "-reporttypes:MarkdownSummaryGithub" || true
          python3 .github/scripts/ci-report.py \
            "$RUNNER_TEMP/gitversion.json" \
            "$RUNNER_TEMP/test-results/test-results.trx" \
            "$RUNNER_TEMP/coverage/SummaryGithub.md" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        # One comment per pull request, updated on every push. It is skipped when the token cannot write:
        # pull requests from forks and from Dependabot.
        if: >-
          ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- entry-hub-ci-report -->"
          { echo "$marker"; echo "## CI report"; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/comment.md"
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md"
          fi

  aspire:
    # Starts PostgreSQL, the API and the reminders service the way the AppHost does, and tests the result.
    # GitHub-hosted Ubuntu runners come with Docker, which Aspire uses to run the PostgreSQL container.
    runs-on: ubuntu-latest
    # A system that does not start must fail the job, not keep it running for the default six hours.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Test the whole system
        run: |
          dotnet restore --locked-mode
          dotnet test tests/EntryHub.AppHost.Tests -c Release --no-restore --filter "Category=Aspire" \
            --logger "console;verbosity=detailed" --blame-hang-timeout 8m
        working-directory: src

  typescript-apphost:
    # The TypeScript AppHost sample must keep compiling against the Aspire SDK it is generated from.
    # It uses the Node.js that GitHub-hosted runners already have.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Build the sample
        run: |
          node --version
          # Building the C# AppHost downloads the Aspire CLI that comes with its SDK.
          dotnet build ../../src/EntryHub.AppHost -c Release --nologo -v quiet
          aspire="$(find "$HOME/.nuget/packages/aspire.cli.linux-x64" -type f -name aspire -path '*linux-x64/aspire' | sort | tail -n 1)"
          npm ci
          "$aspire" restore --non-interactive
          npm run build
        working-directory: samples/typescript-apphost
