# .github/workflows/keep-alive.yml
name: Keep Alive

# Supabase pauses a free project after a week without activity. This calls the API once a day; GET /api/v1/health
# also asks PostgreSQL, which counts as activity, and it wakes the App Service of the demo, which sleeps without
# Always On.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    # Without the URL of the API there is nothing to call yet.
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Call the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            "$API_URL/api/v1/health"
