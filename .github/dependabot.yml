# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      aspire:
        patterns: ["Aspire.*"]
      entity-framework:
        patterns: ["Npgsql.*", "Microsoft.EntityFrameworkCore*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.AspNetCore.Mvc.Testing"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
