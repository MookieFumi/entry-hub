---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "reminders-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "reminders"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "{{ .Values.config.reminders.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}"
  ENTRYHUB_HOST: "{{ .Values.config.reminders.ENTRYHUB_HOST }}"
  ENTRYHUB_PORT: "{{ .Values.config.reminders.ENTRYHUB_PORT }}"
  ENTRYHUB_USERNAME: "{{ .Values.config.reminders.ENTRYHUB_USERNAME }}"
  ENTRYHUB_JDBCCONNECTIONSTRING: "{{ .Values.config.reminders.ENTRYHUB_JDBCCONNECTIONSTRING }}"
  ENTRYHUB_DATABASENAME: "{{ .Values.config.reminders.ENTRYHUB_DATABASENAME }}"
