---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "reminders-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "reminders"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__EntryHub: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.reminders.postgres_password }};Database=entryhub"
  ENTRYHUB_PASSWORD: "{{ .Values.secrets.reminders.postgres_password }}"
  ENTRYHUB_URI: "postgresql://postgres:{{ .Values.secrets.reminders.postgres_password }}@postgres-service:5432/entryhub"
type: "Opaque"
