---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "api-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "{{ .Values.config.api.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "{{ .Values.config.api.ASPNETCORE_FORWARDEDHEADERS_ENABLED }}"
  HTTP_PORTS: "{{ .Values.parameters.api.port_http | int | toString }}"
  ENTRYHUB_HOST: "{{ .Values.config.api.ENTRYHUB_HOST }}"
  ENTRYHUB_PORT: "{{ .Values.config.api.ENTRYHUB_PORT }}"
  ENTRYHUB_USERNAME: "{{ .Values.config.api.ENTRYHUB_USERNAME }}"
  ENTRYHUB_JDBCCONNECTIONSTRING: "{{ .Values.config.api.ENTRYHUB_JDBCCONNECTIONSTRING }}"
  ENTRYHUB_DATABASENAME: "{{ .Values.config.api.ENTRYHUB_DATABASENAME }}"
  Database__MigrateOnStartup: "{{ .Values.config.api.Database__MigrateOnStartup }}"
  Authentication__Schemes__Bearer__ValidIssuer: "{{ .Values.config.api.jwt_issuer }}"
  Authentication__Schemes__Bearer__ValidAudiences__0: "{{ .Values.config.api.jwt_audience }}"
  Authentication__Schemes__Bearer__SigningKeys__0__Issuer: "{{ .Values.config.api.jwt_issuer }}"
  Authentication__Schemes__Bearer__SigningKeys__0__Length: "{{ .Values.config.api.Authentication__Schemes__Bearer__SigningKeys__0__Length }}"
