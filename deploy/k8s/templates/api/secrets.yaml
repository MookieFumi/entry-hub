---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "api-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__EntryHub: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.api.postgres_password }};Database=entryhub"
  ENTRYHUB_PASSWORD: "{{ .Values.secrets.api.postgres_password }}"
  ENTRYHUB_URI: "postgresql://postgres:{{ .Values.secrets.api.postgres_password }}@postgres-service:5432/entryhub"
  Authentication__Schemes__Bearer__SigningKeys__0__Value: "{{ .Values.secrets.api.jwt_signing_key }}"
type: "Opaque"
